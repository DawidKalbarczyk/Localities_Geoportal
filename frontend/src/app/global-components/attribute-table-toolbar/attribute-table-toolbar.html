<div class="toolbar">
    <button class="select-item" matTooltip="Kliknij z wybranym narzędziem na rekord, aby przejść do niego na mapie">
        <img src="./images/icons/touchscreen.png" draggable="false" alt="Select Item">
        <p>Zlokalizuj</p>
        <!--DODAJ TEŻ TRANSLATING DLA TITLE'ÓW-->
    </button>
    <button class="search-item" matTooltip="Wyszukiwarka rekordów po nazwie">
        <img src="./images/icons/loupe.png" draggable="false" alt="Search Item">
        <p>Wyszukaj</p>
    </button>
    <button class="filter-item" matTooltip="Filtracja rekordów">
        <img src="./images/icons/filter.png" draggable="false" alt="Filter Item">
        <p>Filtruj</p>
    </button>
    <button class="reset-filter" matTooltip="Reset filtrów">
        <img src="./images/icons/reset.png" draggable="false" alt="Reset Filter">
        <p>Resetuj filtry</p>
    </button>
    <button class="calculate-field" matTooltip="Oblicz pole na podstawie atrybutów">
        <img src="./images/icons/calculator.png" draggable="false" alt="Calculate Field">
        <p>Oblicz pole</p>
    </button>
</div>
